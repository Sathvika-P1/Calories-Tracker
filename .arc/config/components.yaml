version: 1
components:
  comp_calorie_tracker_api:
    name: Calorie Tracker API
    kind: api_service
    directory: apps/api
    stack:
      choices:
        database: PostgreSQL (via Prisma)
        language: TypeScript
        framework: Node.js + Fastify
        package_manager: pnpm
        testing_tool_e2e: Supertest
        testing_tool_unit: Vitest
  comp_relational_database:
    name: Relational Database
    kind: infrastructure
    stack:
      choices:
        managed_service: PostgreSQL (AWS RDS)
  comp_web_app:
    name: Web App
    kind: web_ui
    directory: apps/web
    stack:
      choices:
        styling: Tailwind CSS
        language: TypeScript
        framework: React + Vite
        package_manager: pnpm
        testing_tool_e2e: Playwright
        testing_tool_unit: Vitest
